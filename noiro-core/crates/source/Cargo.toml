[package]
name = "noiro-source"
description = "The Noiro universal addon system: one Source trait + SourceRegistry over every source kind (Stremio addon, Nuvio provider, native Noiro, ratings/XRDB, scraper, debrid, federated), plus the signed native noiro-source/1 addon manifest that is a strict superset of the Stremio protocol (streaming results, prefetch, debrid-aware, hive-aware, per-profile, signed). Pure; real I/O is the engine phase."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
noiro-protocol = { path = "../protocol" }
noiro-addons = { path = "../addons" }
noiro-adapters = { path = "../adapters" }
noiro-hive = { path = "../hive" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
