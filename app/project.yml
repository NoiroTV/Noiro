name: Noiro
options:
  bundleIdPrefix: com.elvissalihovic.noiro
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Full localization roster shipped by the single Resources/Localizable.xcstrings String Catalog.
  # The catalog compiler emits an .lproj for every localization in the catalog regardless of this list,
  # but declaring knownRegions keeps Xcode's project state, the AppleLanguages override (AppLanguage.set),
  # and Foundation's bundle localization resolution is aware of every code so each pinned language resolves
  # to its real .lproj at runtime. 0.3.9 expanded this from 64 to 106 languages (+ Base) past 100.
  knownRegions:
    - Base
    - en
